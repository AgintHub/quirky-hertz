dag_type: typed
description: Generated workflow from UI.
name: build_gpt6_for_neurips_deep_learning_for_code_workshop
nodes:
  assemble_full_training_corpus:
    agent: false
    description: Integrate all prepared training data into a unified, deduplicated
      training corpus.
    name: assemble_full_training_corpus
    nodes_depended_on:
    - prepare_training_corpus_code_repos
    - prepare_training_corpus_programming_books
    - prepare_training_corpus_stackoverflow_data
    nodes_dependent_on: []
    output_structure:
    - description: The unified training corpus as a list of strings
      key: unified_training_corpus
      type: List[str]
    - description: List of counts for duplicated content
      key: duplicated_content_counts
      type: List[int]
    - description: Whether consistent tokenization was applied successfully
      key: consistent_tokenization_status
      type: bool
    - description: List of training batches as lists of strings
      key: training_batches
      type: List[str]
    prompt: Combine all individual prepared training datasets into one cohesive training
      corpus. Deduplicate content, ensure consistent tokenization, and segment into
      training batches.
  collect_open_source_code_repositories:
    agent: false
    description: Gather a diverse set of open-source code repositories for training.
    name: collect_open_source_code_repositories
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of open-source code repository URLs
      key: repository_list
      type: List[str]
    - description: List of programming languages with their respective repository
        counts
      key: language_distribution
      type: List[str]
    - description: List of repository metadata (language, size, domain)
      key: repository_metadata
      type: List[str]
    prompt: Collect and catalog a large, diverse dataset of open-source code repositories
      across multiple programming languages relevant to deep learning and general
      software development. Provide a list of repositories and metadata (language,
      size, domain).
  collect_programming_books_text:
    agent: false
    description: Acquire text corpora of programming books and documentation for training.
    name: collect_programming_books_text
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The texts or extracts from programming books, tutorials, and official
        documentation.
      key: programming_book_texts
      type: List[str]
    - description: The list of programming languages tagged in the texts.
      key: programming_languages
      type: List[str]
    - description: The list of subjects or topics covered in the texts.
      key: covered_subjects
      type: List[str]
    prompt: Gather full texts or extracts from programming books, tutorials, and official
      documentation to augment training corpus focused on code understanding and generation.
  collect_stackoverflow_and_forum_data:
    agent: false
    description: Download and clean Stack Overflow and relevant Q&A forum posts concerning
      coding and deep learning.
    name: collect_stackoverflow_and_forum_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of Stack Overflow post titles and texts
      key: stackoverflow_posts
      type: List[str]
    - description: List of Q&A forum discussion titles and texts
      key: forum_discussions
      type: List[str]
    - description: List of question texts
      key: questions
      type: List[str]
    - description: List of answer texts
      key: answers
      type: List[str]
    - description: List of code snippets
      key: code_snippets
      type: List[str]
    prompt: Collect Stack Overflow posts and related forum discussions tagged with
      coding and deep learning topics. Process them into structured data suitable
      for training, including questions, answers, and code snippets.
  configure_training_environment:
    agent: false
    description: Set up software environment with dependencies, libraries, and containerization
      tools for training.
    name: configure_training_environment
    nodes_depended_on:
    - select_training_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of environment settings, including installed libraries and
        dependencies.
      key: environment_settings
      type: str
    - description: Whether the environment is containerized.
      key: containerized_environment
      type: bool
    - description: Status of the training environment, including any errors or warnings.
      key: training_environment_status
      type: str
    prompt: Install and configure all software dependencies required for training
      including chosen ML frameworks, distributed training libraries, data loaders,
      and containerization if applicable.
  define_model_specifications:
    agent: false
    description: Specify GPT-6 architecture, size, modality, and design goals tailored
      for code tasks.
    name: define_model_specifications
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Name of the GPT-6 model
      key: model_name
      type: str
    - description: Number of parameters in the GPT-6 model
      key: model_size
      type: int
    - description: Type of input data for the GPT-6 model (e.g., text, code)
      key: model_modality
      type: str
    - description: Architecture of the GPT-6 model
      key: model_architecture
      type: str
    - description: Expected capabilities of the GPT-6 model for deep learning with
        code
      key: expected_capabilities
      type: str
    prompt: Define detailed specifications for the GPT-6 model including number of
      parameters, tokenization strategy adapted to code, model architecture innovations,
      and expected capabilities for deep learning with code. Focus only on architectural
      design and goals.
  evaluate_model_performance:
    agent: false
    description: Assess trained model on code generation, code understanding, and
      language modeling benchmarks.
    name: evaluate_model_performance
    nodes_depended_on:
    - train_gpt6_model
    nodes_dependent_on: []
    prompt: Evaluate the trained GPT-6 model on relevant benchmarks including code
      generation accuracy, syntax correctness, code completion, and programming language
      understanding. Report quantitative metrics and qualitative examples.
  prepare_training_corpus_code_repos:
    agent: false
    description: Clean, tokenize, and format open-source code repositories for model
      ingestion.
    name: prepare_training_corpus_code_repos
    nodes_depended_on:
    - collect_open_source_code_repositories
    nodes_dependent_on: []
    output_structure:
    - description: Cleaned and formatted code repository data
      key: cleaned_repository_data
      type: str
    - description: Tokenized code data
      key: tokenized_code
      type: List[str]
    - description: Prepared training samples from the code repositories
      key: training_samples
      type: List[str]
    prompt: Clean raw code repositories by removing non-code files, tokenize code
      appropriately (e.g., subword tokenization with code-aware adjustments), and
      convert into training samples.
  prepare_training_corpus_programming_books:
    agent: false
    description: Clean, tokenize, and format programming books and documentation into
      training data.
    name: prepare_training_corpus_programming_books
    nodes_depended_on:
    - collect_programming_books_text
    nodes_dependent_on: []
    output_structure:
    - description: Preprocessed text content of programming books and documentation
      key: cleaned_book_content
      type: str
    - description: List of tokenized book data after cleaning and standardizing formatting
      key: tokenized_book_data
      type: List[str]
    - description: List of structured book samples suitable for training, including
        questions, answers, and code snippets
      key: structured_book_samples
      type: List[str]
    - description: List of counts of noisy content removed during cleaning
      key: counts_of_noisy_content
      type: List[int]
    prompt: Preprocess programming book texts by cleaning, standardizing formatting,
      tokenizing with code-aware tokenizer, and structuring data for training.
  prepare_training_corpus_stackoverflow_data:
    agent: false
    description: Clean, tokenize, and convert Stack Overflow and forum data into training
      samples.
    name: prepare_training_corpus_stackoverflow_data
    nodes_depended_on:
    - collect_stackoverflow_and_forum_data
    nodes_dependent_on: []
    output_structure:
    - description: List of cleaned Stack Overflow posts
      key: cleaned_posts
      type: List[str]
    - description: List of tokenized content from Stack Overflow posts
      key: tokenized_content
      type: List[str]
    - description: List of formatted paired questions and answers including code snippets
      key: formatted_pairs
      type: List[str]
    - description: Whether the cleaning and formatting process is valid
      key: validation_status
      type: bool
    prompt: Clean collected Stack Overflow posts by removing noise, tokenize content
      with the designated tokenizer, and format paired questions and answers including
      code snippets as training examples.
  prepare_workshop_presentation_materials:
    agent: false
    description: Create slides, demos, and documentation explaining GPT-6 design,
      training, and benchmark results for the workshop.
    name: prepare_workshop_presentation_materials
    nodes_depended_on:
    - evaluate_model_performance
    nodes_dependent_on: []
    output_structure:
    - description: The title of the slide covering GPT-6 architecture.
      key: workshop_slide_title
      type: str
    - description: The name of the dataset used for training the GPT-6 model.
      key: dataset_used
      type: str
    - description: A summary of the benchmark results, including code generation accuracy
        and syntax correctness.
      key: benchmark_results
      type: str
    - description: The final presentation materials, including slides and live demo
        scripts.
      key: presentation_materials
      type: str
    prompt: Develop clear presentation materials including slides and live demo scripts
      for the NeurIPS Deep Learning for Code workshop, covering GPT-6 architecture,
      training pipeline, datasets used, benchmark results, and implications for code
      AI.
  select_hardware_infrastructure:
    agent: false
    description: Decide on computing resources for model training including GPUs/TPUs
      and storage.
    name: select_hardware_infrastructure
    nodes_depended_on:
    - define_model_specifications
    nodes_dependent_on: []
    output_structure:
    - description: Type of hardware infrastructure selected (e.g., GPU, TPU, CPU)
      key: hardware_infrastructure_type
      type: str
    - description: Number of nodes in the hardware infrastructure
      key: number_of_nodes
      type: int
    - description: Memory requirements of the hardware infrastructure (e.g., in GB)
      key: memory_required
      type: str
    - description: Storage requirements of the hardware infrastructure (e.g., in GB)
      key: storage_required
      type: str
    - description: Description of the reasoning behind the selected hardware infrastructure
      key: reasoning_description
      type: str
    prompt: Based on model specifications, select appropriate hardware infrastructure
      including GPU/TPU types, number of nodes, memory, and storage required. Describe
      the reasoning concisely.
  select_training_framework:
    agent: false
    description: Choose machine learning frameworks and distributed training tools
      for GPT-6 training.
    name: select_training_framework
    nodes_depended_on:
    - assemble_full_training_corpus
    - select_hardware_infrastructure
    nodes_dependent_on: []
    output_structure:
    - description: Selected machine learning framework (e.g., PyTorch, TensorFlow)
      key: selected_framework
      type: str
    - description: Selected distributed training toolkit (e.g., DeepSpeed, Megatron)
      key: selected_toolkit
      type: str
    - description: List of selected hardware resources (e.g., GPUs, TPUs)
      key: hardware_resources
      type: str
    - description: Detailed training plan with epoch count, batch size, and learning
        rate
      key: training_plan
      type: str
    prompt: Select ML frameworks (e.g., PyTorch, TensorFlow) and distributed training
      solutions (e.g., DeepSpeed, Megatron) for efficient training of a large GPT-6
      model specialized on code data.
  train_gpt6_model:
    agent: false
    description: Run the model training process using defined specifications and prepared
      corpus.
    name: train_gpt6_model
    nodes_depended_on:
    - configure_training_environment
    nodes_dependent_on: []
    output_structure:
    - description: Training metrics, such as loss and accuracy, during the model training
        process.
      key: training_metrics
      type: str
    - description: Whether the model training process has reached a reasonable accuracy
        and is ready to be used.
      key: checkpoint_status
      type: bool
    - description: Total time taken to train the GPT-6 model.
      key: training_time
      type: int
    prompt: Execute the training loop for the GPT-6 model on the assembled training
      data using the configured environment. Focus on progressive training, checkpointing,
      and monitoring metrics for code understanding and generation.
